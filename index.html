<!DOCTYPE html>
<html>
<head>
  <title>3D Online Chess Pro</title>
  <style>
    body { margin:0; overflow:hidden; background:#111; font-family:sans-serif; }
    #chat { position:absolute; right:0; top:0; width:250px; height:100%; background:#222; color:#fff; overflow-y:auto; padding:10px; }
    #chat input { width:100%; margin-top:5px; }
    #timer { position:absolute; left:10px; top:10px; color:#fff; font-size:20px; }
  </style>
</head>
<body>
<div id="timer"></div>
<div id="chat">
  <div id="messages"></div>
  <input id="chatInput" placeholder="Type..." />
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyDRna9X7GVgBwj5xjECu-bJYos_1UMCLh4",
  authDomain: "chess-a4f8a.firebaseapp.com",
  projectId: "chess-a4f8a",
  storageBucket: "chess-a4f8a.firebasestorage.app",
  messagingSenderId: "631062330530",
  appId: "1:631062330530:web:f003eabd02559c9b4dabfb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let userId = null;
await signInAnonymously(auth).then(res => userId = res.user.uid);

// ===== CHESS LOGIC (same as before, omitted for brevity) =====
const EMPTY = null;
let board = [
["br","bn","bb","bq","bk","bb","bn","br"],
["bp","bp","bp","bp","bp","bp","bp","bp"],
[EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY],
[EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY],
[EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY],
[EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY],
["wp","wp","wp","wp","wp","wp","wp","wp"],
["wr","wn","wb","wq","wk","wb","wn","wr"]
];
let turn = "w";
function isInsideBoard(r,c){return r>=0&&r<8&&c>=0&&c<8;}
function getColor(piece){return piece?piece[0]:null;}
function getType(piece){return piece?piece[1]:null;}

// ===== THREE.JS SCENE =====
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4, 8, 10);
camera.lookAt(4, 0, 4);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 0.8); light.position.set(5,10,5); scene.add(light);

// ===== BOARD =====
const squares=[];
for(let r=0;r<8;r++){for(let c=0;c<8;c++){
  const color=(r+c)%2===0?0xffffff:0x333333;
  const mat=new THREE.MeshStandardMaterial({color});
  const geo=new THREE.BoxGeometry(1,0.1,1);
  const sq=new THREE.Mesh(geo, mat);
  sq.position.set(c,0,r); sq.userData={r,c}; scene.add(sq); squares.push(sq);
}}

// ===== PIECES =====
const pieces={};
const loader = new GLTFLoader();
const pieceModels = {
  w: {}, b: {}
};

// Preload GLB models (you must host these yourself)
const pieceTypes = ["p","r","n","b","q","k"];
for(const color of ["w","b"]){
  for(const type of pieceTypes){
    loader.load(`models/${color}${type}.glb`, gltf => { pieceModels[color][type] = gltf.scene; });
  }
}

function createPiece(type,color,r,c){
  const model = pieceModels[color][type].clone();
  model.position.set(c,0.1,r);
  model.userData={r,c,type,color};
  scene.add(model);
  pieces[`${r}-${c}`] = model;
}

function loadBoard(){
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      let p=board[r][c];
      if(p) createPiece(getType(p),getColor(p),r,c);
    }
  }
}
loadBoard();

// ===== HIGHLIGHT LEGAL MOVES =====
const highlightMat = new THREE.MeshStandardMaterial({color:0xffff00, transparent:true, opacity:0.5});
let highlightSquares = [];
function showHighlights(moves){
  highlightSquares.forEach(sq=>scene.remove(sq));
  highlightSquares=[];
  moves.forEach(([r,c])=>{
    const geo = new THREE.BoxGeometry(1,0.05,1);
    const sq = new THREE.Mesh(geo, highlightMat);
    sq.position.set(c,0.11,r);
    scene.add(sq);
    highlightSquares.push(sq);
  });
}

// ===== CLICK LOGIC =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selected = null;
window.addEventListener("click", e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const intersects = raycaster.intersectObjects(scene.children);
  if(intersects.length>0){
    const obj = intersects[0].object;
    if(obj.userData?.type){
      selected=obj;
      const moves = getLegalMoves(obj.userData.r,obj.userData.c);
      showHighlights(moves);
    } else if(selected && obj.userData){
      move3DPiece(selected,obj.userData.r,obj.userData.c);
      highlightSquares.forEach(sq=>scene.remove(sq));
      highlightSquares=[];
      selected=null;
    }
  }
});

function move3DPiece(piece,tr,tc){
  let fr=piece.userData.r,fc=piece.userData.c;
  if(!getLegalMoves(fr,fc).some(m=>m[0]===tr&&m[1]===tc)) return;
  board[tr][tc]=board[fr][fc]; board[fr][fc]=null;
  // Animate piece
  const targetPos = {x:tc, z:tr};
  new TWEEN.Tween(piece.position).to({x:tc, z:tr}, 300).start();
  piece.userData.r=tr; piece.userData.c=tc;
  delete pieces[`${fr}-${fc}`]; pieces[`${tr}-${tc}`]=piece;
  turn = turn==="w"?"b":"w";
  if(gameId) setDoc(doc(db,"games",gameId),{board,turn},{merge:true});
}

// ===== MULTIPLAYER =====
let gameId = crypto.randomUUID();
await setDoc(doc(db,"games",gameId),{board,turn,players:{white:userId,black:null},status:"waiting"});
onSnapshot(doc(db,"games",gameId),snap=>{const data=snap.data(); if(!data)return; board=data.board; turn=data.turn; sync3DBoard(board);});
function sync3DBoard(b){for(let k in pieces)scene.remove(pieces[k]); Object.keys(pieces).forEach(k=>delete pieces[k]); for(let r=0;r<8;r++){for(let c=0;c<8;c++){let p=b[r][c]; if(p) createPiece(getType(p),getColor(p),r,c);}}}

// ===== CHAT =====
const chatInput=document.getElementById("chatInput");const messagesDiv=document.getElementById("messages");
chatInput.addEventListener("keypress",async e=>{if(e.key==="Enter"){await addDoc(collection(db,"chats",gameId,"messages"),{sender:userId,text:chatInput.value,timestamp:Date.now()});chatInput.value="";}});
onSnapshot(collection(db,"chats",gameId,"messages"),snap=>{snap.docChanges().forEach(change=>{if(change.type==="added"){const m=change.doc.data();const d=document.createElement("div");d.textContent=m.text;messagesDiv.appendChild(d);messagesDiv.scrollTop=messagesDiv.scrollHeight;}});});

// ===== TIMER =====
let timers={w:300,b:300};const timerDiv=document.getElementById("timer");
setInterval(()=>{timers[turn]--; timerDiv.textContent=`White:${timers.w}s Black:${timers.b}s`; if(timers[turn]<=0){alert((turn==="w"?"Black":"White")+" wins on time!");}},1000);

// ===== RENDER =====
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}
animate();
</script>

<!-- Add Tween.js for smooth animation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</body>
</html>
